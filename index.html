<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover luxury homes, waterfront condos and exceptional real estate in Miami, Florida with Haven Estates.">
<title>Haven Estates | Miami Luxury Real Estate</title>
<style>
:root{--green:#153b32;--gold:#c6a66b;--cream:#f8f7f3;--ink:#202923}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:85px}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:white;line-height:1.6}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent}
.topbar{background:var(--green);color:white;text-align:center;padding:9px;font-size:12px;letter-spacing:1px}
header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;background:white;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.logo{font-family:Georgia,serif;font-size:24px;color:var(--green);font-weight:bold;letter-spacing:-1px}
.logo small{display:block;font-family:Arial,sans-serif;font-size:9px;letter-spacing:4px;font-weight:normal;text-align:center}
nav{display:flex;align-items:center;gap:25px;font-size:13px}
nav a:hover{color:#a17d3f}
.nav-cta,.btn{display:inline-block;background:var(--green);color:white;padding:13px 21px;border:0;cursor:pointer;font-size:13px;letter-spacing:.4px}
.menu{display:none;background:none;border:0;font-size:26px;cursor:pointer}
.hero{min-height:590px;display:flex;align-items:center;padding:85px 8%;color:white;background:linear-gradient(90deg,#102b25ed 0%,#102b2590 55%,#102b2530),url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=2000&q=85') center/cover}
.hero-content{max-width:720px}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:bold}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:normal;line-height:1.2}
h1{font-size:clamp(42px,6vw,76px);margin:22px 0}
.hero p{max-width:520px;color:#e4e8e4;font-size:16px}
.hero .btn{background:var(--gold);color:#152a22;margin-top:28px}
.searchbox{position:relative;margin:-35px auto 0;width:88%;max-width:1100px;background:white;padding:24px;box-shadow:0 10px 35px #00000012;display:grid;grid-template-columns:repeat(3,1fr) auto;gap:15px;z-index:2}
.searchbox label,.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:#626b65}
.searchbox select,.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #e2e4df;background:white;border-radius:0;outline-color:var(--gold)}
.searchbox button{align-self:end;height:46px}
section{padding:85px 7%}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:35px}
.section-head h2,.center-head h2{font-size:clamp(30px,4vw,43px);margin-top:12px}
.section-head p,.center-head p{color:#717971;font-size:14px;margin-top:12px}
.text-link{color:var(--green);font-size:13px;border-bottom:1px solid var(--gold);padding-bottom:5px}
.center-head{text-align:center;max-width:650px;margin:0 auto 38px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.property{border:1px solid #ecece7;background:white;transition:transform .2s,box-shadow .2s}
.property:hover{transform:translateY(-4px);box-shadow:0 12px 28px #00000010}
.photo{height:245px;position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.property:hover img{transform:scale(1.04)}
.tag{position:absolute;top:15px;left:15px;background:white;padding:7px 10px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.details{padding:23px}
.price{color:#98763f;font-size:21px;font-family:Georgia,serif;margin-bottom:8px}
.details h3{font-size:22px;margin-bottom:8px}
.location{font-size:12px;color:#777;margin-bottom:18px}
.specs{border-top:1px solid #eee;padding-top:14px;display:flex;gap:16px;font-size:12px;color:#626b65}
.about{background:var(--cream);display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.about-img{height:470px;width:100%;object-fit:cover}
.about h2{font-size:clamp(34px,4vw,48px);margin:15px 0 20px}
.about p{color:#69716b;font-size:14px;margin-bottom:15px}
.about .btn{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:30px;border-top:1px solid #ddd;padding-top:22px}
.stats strong{font:28px Georgia,serif;color:var(--green);display:block}
.stats span{font-size:11px;color:#777}
.communities{background:#fff}
.community{height:280px;position:relative;overflow:hidden;color:white}
.community
